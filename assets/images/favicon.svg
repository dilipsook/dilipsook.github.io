<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Specular Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Monogram Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Glowing Cyan Status Beacon Gradient -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .bg-card { fill: url(#bgGrad); stroke: url(#borderGrad); stroke-width: 2.2; }
    .monogram-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 900;
      font-size: 27px;
      letter-spacing: -0.8px;
      fill: url(#textGrad);
      text-anchor: middle;
      dominant-baseline: central;
    }
    @media (prefers-color-scheme: light) {
      .bg-card { fill: #0f172a; stroke: #0284c7; stroke-width: 2.5; }
      .monogram-text { fill: #ffffff; }
    }
  </style>

  <!-- Squircle Base with Specular Rim -->
  <rect class="bg-card" x="3" y="3" width="58" height="58" rx="16" ry="16"/>

  <!-- Inner Soft Inset Sheen -->
  <rect x="4.5" y="4.5" width="55" height="26" rx="14.5" ry="14.5" fill="white" opacity="0.04"/>

  <!-- Monogram DK -->
  <text class="monogram-text" x="31" y="33" filter="url(#glowDrop)">DK</text>

  <!-- Live Multi-Cloud Beacon Aura (Top Right) -->
  <circle cx="50" cy="14" r="7" fill="url(#beaconGlow)"/>
  <circle cx="50" cy="14" r="3.2" fill="#00f0ff"/>
</svg>
