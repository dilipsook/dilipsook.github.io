<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Kumar — Multi-Cloud &amp; FinOps Architect</title>
  <link rel="canonical" href="https://dilipsook.github.io/">
  <meta http-equiv="refresh" content="0; url=../">
  <script>
    // Seamlessly forward to root portfolio preserving query params and anchor hash
    window.location.replace('../' + window.location.search + window.location.hash);
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #0c152a 0%, #030712 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .redirect-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 44px 48px;
      text-align: center;
      max-width: 520px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(56, 189, 248, 0.25);
      animation: fadeInScale 0.4s ease-out;
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .badge-icon {
      font-size: 2.4rem;
      margin-bottom: 14px;
      display: inline-block;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.6));
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      font-size: 0.92rem;
      color: #38bdf8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 32px;
      background: #ffffff;
      color: #030712;
      font-weight: 800;
      font-size: 0.95rem;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 
        0 6px 20px rgba(255, 255, 255, 0.35),
        0 0 25px rgba(56, 189, 248, 0.4);
      transition: all 0.25s ease;
    }
    .btn-enter:hover {
      transform: translateY(-2px) scale(1.02);
      background: #f0f9ff;
      color: #0284c7;
      box-shadow: 
        0 8px 28px rgba(56, 189, 248, 0.6),
        0 0 35px rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="badge-icon">⚡</div>
    <h1>Dilip Kumar</h1>
    <div class="sub">Multi-Cloud &amp; FinOps Architect</div>
    <p>Navigating to the canonical modern enterprise portfolio featuring dark mode, Apple iOS liquid glass materials, and interactive architecture reels...</p>
    <a href="../" class="btn-enter">
      <span>Enter Portfolio</span>
      <span>&rarr;</span>
    </a>
  </div>
</body>
</html>
